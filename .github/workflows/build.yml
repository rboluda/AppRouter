# Compila AppRouter en cada push, pull request y etiqueta, como comprobación (el resultado queda
# como artefacto). Las Releases NO se crean aquí: las publica scripts/publicar.ps1 desde el equipo
# que tiene el certificado de firma, que nunca se sube a GitHub. Lo compilado aquí va sin firmar.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versión
        id: ver
        shell: pwsh
        run: |
          # En una etiqueta vX.Y.Z la versión sale de la etiqueta; si no, la del .csproj.
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = ([xml](Get-Content AppRouter/AppRouter.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar (descarga y verifica sing-box)
        run: dotnet publish AppRouter/AppRouter.csproj -c Release -o dist -p:Version=${{ steps.ver.outputs.version }}

      - name: Preparar archivos
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Move-Item dist/AppRouter.exe "dist/AppRouter-$v.exe"
          Copy-Item docs/LEEME.txt dist/
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: AppRouter-${{ steps.ver.outputs.version }}
          path: dist/*
